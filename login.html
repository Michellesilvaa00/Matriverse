<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>MATRIVERSE · Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Orbitron:wght@700;900&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="cadastro.css"/>
</head>
<body>
  <div class="space-bg">
    <div class="stars s1"></div><div class="stars s2"></div><div class="stars s3"></div>
    <div class="nebula nb1"></div><div class="nebula nb2"></div>
  </div>

  <div class="page-wrap">
    <a href="landing.html" class="logo">
      <div class="planet-sm"><div class="pc"></div><div class="ring"></div></div>
      <span class="logo-text">MATRI<span>VERSE</span></span>
    </a>

    <div class="card">
      <h1 class="card-title">Entrar</h1>
      <p class="card-sub">Bem-vindo de volta ao MATRIVERSE.</p>

      <div id="erro" class="msg-erro" style="display:none"></div>

      <form id="formLogin">
        <label class="field">
          <span>E-mail</span>
          <input type="email" id="email" placeholder="voce@galaxia.com" required/>
        </label>
        <label class="field">
          <span>Senha</span>
          <input type="password" id="senha" placeholder="••••••••" required/>
        </label>
        <button type="submit" class="btn-neon" id="btnEntrar">🚀 Entrar no MATRIVERSE</button>
      </form>

      <p class="link-login">Não tem conta? <a href="cadastro.html">Cadastrar</a></p>
    </div>
  </div>

  <script src="api.js"></script>
  <script>
    const elErr = document.getElementById('erro');
    const btn   = document.getElementById('btnEntrar');
    function setErro(msg){ elErr.textContent=msg; elErr.style.display=msg?'block':'none'; }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      setErro('');
      const email = document.getElementById('email').value.trim();
      const senha = document.getElementById('senha').value;
      btn.textContent='Entrando...'; btn.disabled=true;
      const res = await API.login(email, senha);
      btn.textContent='🚀 Entrar no MATRIVERSE'; btn.disabled=false;
      if(res.erro){ setErro(res.erro); return; }
      sessionStorage.setItem('mv_usuario', JSON.stringify(res.usuario));
      window.location.href = res.usuario.perfil === 'docente' ? 'docente.html' : 'index.html';
    });
  </script>
</body>
</html>
